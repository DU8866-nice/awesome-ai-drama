        en: "Unlimited-length talking video for image-to-video and video-to-video."
      - repo: TMElyralab/MuseTalk
        zh: "实时高质量口型同步。"
        en: "Real-time high-quality lip sync."
      - repo: bytedance/LatentSync
        zh: "字节 LatentSync，基于扩散模型的口型同步。"
        en: "ByteDance LatentSync, diffusion-based lip sync."
      - repo: jixiaozhong/Sonic
        zh: "关注全局音频感知的人像动画。"
        en: "Portrait animation driven by global audio perception."
      - repo: MeiGen-AI/MultiTalk
        zh: "音频驱动的多人对话视频生成。"
        en: "Audio-driven multi-person conversational video generation."
      - repo: Tencent-Hunyuan/HunyuanVideo-Avatar
        zh: "混元视频数字人，音频驱动的多角色动画。"
        en: "Hunyuan video avatar for audio-driven multi-character animation."
      - repo: Fantasy-AMAP/fantasy-talking
        zh: "动作连贯的说话人像生成。"
        en: "Talking portrait generation with coherent motion."
      - repo: fudan-generative-vision/hallo3
        zh: "基于视频 DiT 的高动态人像动画。"
        en: "Highly dynamic portrait animation built on a video diffusion transformer."
      - repo: antgroup/echomimic_v3
        zh: "蚂蚁 EchoMimic V3，1.3B 参数的多模态人体动画。"
        en: "Ant Group EchoMimic V3, 1.3B multimodal human animation."

  - id: audio
    zh: "配乐与音效"
    en: "Music and sound effects"
    zh_intro: "背景音乐、主题曲和拟音音效。MMAudio、HunyuanVideo-Foley、ThinkSound 可以直接根据画面生成音效。"
    en_intro: "Score, theme songs and Foley. MMAudio, HunyuanVideo-Foley and ThinkSound generate sound effects from the video itself."
    items:
      - repo: ace-step/ACE-Step-1.5
        zh: "本地音乐生成模型，支持 Mac、AMD、Intel 和 CUDA。"
        en: "Local music generation model for Mac, AMD, Intel and CUDA."
      - repo: multimodal-art-projection/YuE
        zh: "YuE 完整歌曲生成，支持翻唱和音乐编辑。"
        en: "YuE full-song generation with covers and music editing."
      - repo: fspecii/ace-step-ui
        zh: "ACE-Step 1.5 的图形界面，免费本地生成音乐。"
        en: "Desktop UI for ACE-Step 1.5, free local music generation."
      - repo: HeartMuLa/heartlib
        zh: "HeartMuLa 开源音乐生成模型。"
        en: "HeartMuLa open music generation model."
      - repo: ASLP-lab/DiffRhythm
        zh: "快速的端到端整首歌曲生成。"
        en: "Fast end-to-end full-length song generation."
      - repo: hkchengrex/MMAudio
        zh: "根据视频生成匹配的音频。"
        en: "Video-to-audio synthesis."
      - repo: QwenAudio/ThinkSound
        zh: "通义 ThinkSound，用思维链从任意模态生成音频，可给画面配音效。"
        en: "ThinkSound, chain-of-thought audio generation from any modality, including video."
      - repo: Tencent-Hunyuan/HunyuanVideo-Foley
        zh: "混元视频拟音，给画面配高保真音效。"
        en: "Hunyuan Foley for high-fidelity sound effects from video."

  - id: post
    zh: "剪辑、字幕与后期"
    en: "Editing, subtitles and post-production"
    zh_intro: "出片以后的最后一公里：识别字幕、翻译出海、超分辨率、补帧和剪辑。"
    en_intro: "The last mile after generation: transcription, translation for overseas release, upscaling, frame interpolation and editing."
    items:
      - repo: xinntao/Real-ESRGAN
        zh: "通用的图像 / 视频超分辨率修复（较老，仍很常用）。"
        en: "General image and video super-resolution (older but still widely used)."
      - repo: SYSTRAN/faster-whisper
        zh: "更快的 Whisper 语音识别，做字幕的基础组件。"
        en: "Faster Whisper transcription, a building block for subtitles."
      - repo: m-bain/whisperX
        zh: "带词级时间戳和说话人分离的语音识别。"
        en: "Speech recognition with word-level timestamps and diarization."
      - repo: k4yt3x/video2x
        zh: "基于机器学习的视频超分和补帧。"
        en: "Machine-learning video upscaling and frame interpolation."
      - repo: jianchang512/pyvideotrans
        zh: "视频翻译，自动配音并嵌入字幕，适合短剧出海。"
        en: "Translates videos with dubbing and embedded subtitles, useful for overseas release."
      - repo: Huanshere/VideoLingo
        zh: "Netflix 级字幕切分、翻译、对齐，还能配音，一键全自动。"
        en: "Netflix-grade subtitle splitting, translation, alignment and dubbing in one click."
      - repo: AaronFeng753/Waifu2x-Extension-GUI
        zh: "视频 / 图片 / GIF 超分和补帧图形工具，集成 Real-ESRGAN、Real-CUGAN、RIFE 等，动漫画面效果好。"
        en: "GUI for upscaling and interpolation with Real-ESRGAN, Real-CUGAN, RIFE and more; good for anime."
      - repo: WEIFENG2333/VideoCaptioner
        zh: "卡卡字幕助手，基于大模型做字幕生成、断句、校正和翻译。"
        en: "LLM-powered subtitle generation, segmentation, correction and translation."
      - repo: mltframework/shotcut
        zh: "跨平台开源视频剪辑软件。"
        en: "Cross-platform open-source video editor."
      - repo: buxuku/SmartSub
        zh: "视频转字幕、翻译、AI 配音与声音克隆、字幕烧录的一站式桌面工具。"
        en: "Desktop app to transcribe, translate, dub and burn subtitles."
      - repo: ByteDance-Seed/SeedVR
        zh: "字节 SeedVR / SeedVR2，基于扩散模型的视频修复和超分。"
        en: "ByteDance SeedVR and SeedVR2, diffusion-based video restoration and upscaling."
      - repo: hzwer/Practical-RIFE
        zh: "实用的视频补帧，提升流畅度。"
        en: "Practical frame interpolation for smoother motion."

  - id: narration
    zh: "解说、推文与短视频二创"
    en: "Narration, novel promos and short video"
    zh_intro: "不做完整剧情，而是做影视解说、小说推文、高光切片的路线。"
    en_intro: "For commentary videos, novel promos and highlight clips rather than full dramas."
    items:
      - repo: harry0703/MoneyPrinterTurbo
        zh: "输入主题或关键词，一键生成高清短视频。"
        en: "Generates HD short videos from a topic or keyword."
      - repo: linyqh/NarratoAI
        zh: "用大模型一键生成解说并剪辑视频，适合影视和短剧解说。"
        en: "One-click AI narration and editing, suited to film and drama recaps."
      - repo: liuzhao1225/YouDub-webui
        zh: "视频翻译配音：语音识别、字幕翻译、声音克隆、混音渲染。"
        en: "Video localization and dubbing with recognition, translation, voice cloning and mixing."
      - repo: Agions/dramaxis
        zh: "剧枢，多智能体影视叙事与解说平台，可与剪映草稿互通。"
        en: "Multi-agent narrative and commentary platform that works with CapCut drafts."
      - repo: tyxben/AI_novel
        zh: "小说一键转短视频（有声书 + AI 配图），适用于抖音 / 小红书。"
        en: "Turns novels into short videos with narration and AI images for Douyin and Xiaohongshu."

  - id: comfyui
    zh: "ComfyUI 生态"
    en: "ComfyUI ecosystem"
    zh_intro: "本地方案的核心。大多数开源视频、配音、口型模型都有 ComfyUI 节点。"
    en_intro: "The core of most local setups; nearly every open video, voice and lip-sync model has ComfyUI nodes."
    items:
      - repo: Comfy-Org/ComfyUI
        zh: "节点式扩散模型界面与后端，本地 AIGC 的事实标准。"
        en: "Node-based diffusion GUI and backend, the de facto standard for local AIGC."
      - repo: kijai/ComfyUI-WanVideoWrapper
        zh: "在 ComfyUI 里使用万相等视频模型的封装节点。"
        en: "ComfyUI wrapper nodes for Wan and related video models."
      - repo: kijai/ComfyUI-LivePortraitKJ
        zh: "LivePortrait 的 ComfyUI 节点。"
        en: "ComfyUI nodes for LivePortrait."
      - repo: Kosinkadink/ComfyUI-VideoHelperSuite
        zh: "视频加载、合成、导出等常用视频节点。"
        en: "Common video nodes for loading, combining and exporting."
      - repo: Fannovel16/ComfyUI-Frame-Interpolation
        zh: "ComfyUI 补帧节点。"
        en: "Frame interpolation nodes for ComfyUI."
      - repo: JGRFW/comfyui-AICG3D
        zh: "ComfyUI 本地短剧工作台插件，支持长视频生成。"
        en: "Local short-drama workspace plugin for ComfyUI with long-video generation."

  - id: prompts
    zh: "提示词与案例库"
    en: "Prompt and case libraries"
    zh_intro: "抄作业专区。"
    en_intro: "Copy what already works."
    items:
      - repo: ai-boost/awesome-image-video-prompts
        zh: "主流图像 / 视频模型的可复制提示词，附真实输出和出处。"
        en: "Copy-ready prompts for leading image and video models, with real outputs and sources."
      - repo: ZeroLu/awesome-seedance
        zh: "Seedance 2.0 高质量提示词与资源，覆盖电影、动漫、广告等场景。"
        en: "High-fidelity Seedance 2.0 prompts and resources for film, anime and ads."
      - repo: LearnPrompt/awesome-seedance
        zh: "有出处可查的 Seedance 提示词库，带跨模型复测和模板，中英日三语。"
        en: "Source-traced Seedance prompt library with cross-model retests and templates in three languages."

