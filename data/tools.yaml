compliance:
  - title_zh: "《人工智能生成合成内容标识办法》"
    title_en: "Measures for Labeling AI-Generated Synthetic Content"
    url: https://www.cac.gov.cn/2025-03/14/c_1743654684782215.htm
    zh: "国家网信办等四部门发布，2025 年 9 月 1 日起施行。AI 生成的视频、音频需要添加显式标识和元数据隐式标识，不得恶意删除或篡改标识。"
    en: "Issued by the CAC and three other authorities, in force since 1 September 2025. AI-generated video and audio need visible labels and metadata labels, which must not be removed or altered."
  - title_zh: "《微短剧发展管理办法》（国家广播电视总局令第 16 号）"
    title_en: "Micro-Drama Development Management Measures (NRTA Order No. 16)"
    url: https://www.news.cn/legal/20260731/4b8eea40226644d0a347c72ea1b21b75/c.html
    zh: "2026 年 9 月 1 日起施行，按投资额度、题材把微短剧分为三类，分类实行备案公示和发行许可。"
    en: "In force since 1 September 2026; micro-dramas are split into three classes by budget and subject, each with filing and distribution licensing."
  - title_zh: "《管理提示（AI 微短剧分类分层标准）》"
    title_en: "Notice on tiers for AI micro-dramas"
    url: https://m.163.com/dy/article/L0B868QC053469RG.html
    zh: "广电总局网络视听司 2026 年 6 月 25 日发布、7 月 1 日起施行：投资 80 万元及以上或涉及特殊题材为\"重点\"，30 至 80 万元一般题材为\"普通\"，不足 30 万元一般题材为\"其他\"。（链接为央视新闻稿件转载）"
    en: "Published by the NRTA on 25 June 2026 and effective 1 July 2026; AI micro-dramas are tiered by budget (800k CNY and above or special subjects, 300k to 800k, under 300k). Link is a CCTV News report."

