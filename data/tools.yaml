# Source of truth for README.md and README.en.md.
# Edit this file, then run: python scripts/build_readme.py
# Each GitHub entry needs `repo`, `zh` and `en`. Keep descriptions to one sentence.

categories:
  - id: platforms
    zh: "一站式短剧 / 漫剧创作平台"
    en: "All-in-one drama studios"
    zh_intro: "从小说或一句话创意出发，串起剧本、角色资产、分镜、出图出视频和成片的开源工作台，多数支持本地部署和自选模型。"
    en_intro: "Open-source workspaces that take a novel or a one-line idea through script, character assets, storyboard, image and video generation to a finished cut. Most can be self-hosted with your own model keys."
    items:
      - repo: HBAI-Ltd/Toonflow-app
        zh: "短剧、漫剧制作平台，无限画布 + AI Agent + 可视化工作流，覆盖剧本、分镜、角色场景资产与图像视频生成，支持本地部署、MCP 和插件。"
        en: "Drama and motion-comic studio with an infinite canvas, AI agents and visual workflows covering script, storyboard, assets and image/video generation; self-hostable with MCP and plugins."
      - repo: chatfire-AI/huobao-drama
        zh: "火宝短剧，一句话生成完整短剧，从剧本到成片全自动。"
        en: "Huobao Drama, an end-to-end generator that turns one sentence into a finished short drama."
      - repo: dramaclaw/dramaclaw
        zh: "通用 AIGC 视频引擎，剧本到成片一条流水线，漫剧、广告、电商视频都能做。"
        en: "General-purpose AIGC video engine with one pipeline from script to film, for dramas, ads and product videos."
      - repo: yi1108/printfilm
        zh: "AI 短视频营销与 AI 短剧创作平台。"
        en: "Platform for AI short-video marketing and AI short-drama creation."
      - repo: Forget-C/Jellyfish
        zh: "面向 AI 短剧的端到端生产工作台：剧本输入、结构化分镜、一致性管理、镜头准备、视频生成到导出。"
        en: "End-to-end production workspace for AI short dramas, from script and structured storyboards to consistency management, generation and export."
      - repo: ArcReel/ArcReel
        zh: "Agent 驱动、可自部署的视频工作台，把小说和剧本转成角色、场景、道具资产、分镜、视频和剪映草稿，带跨镜头一致性和费用追踪。"
        en: "Self-hosted, agent-driven workspace that turns novels and scripts into assets, storyboards, videos and CapCut drafts, with cross-shot consistency and cost tracking."
      - repo: shuyu-labs/BigBanana-AI-Director
        zh: "一站式 AI 短剧 / 漫剧导演平台，采用 Script-to-Asset-to-Keyframe 工作流控制角色一致性和镜头运动。"
        en: "AI drama director platform built on a Script-to-Asset-to-Keyframe workflow for consistent characters, scenes and camera moves."
      - repo: xuanyustudio/LocalMiniDrama
        zh: "本地运行的 AI 短剧 / 漫剧生成工具，故事 → 分镜 → 视频，数据不出本机，已接入 Seedance 2。"
        en: "Local-first AI drama maker, story to storyboard to video with data kept on your machine; supports Seedance 2."
      - repo: alibaba/lumenx
        zh: "阿里开源的 LumenX Studio，把小说文本转成动态视频，打通剧本分析、角色定制、分镜绘制到视频合成。"
        en: "LumenX Studio from Alibaba, turning novel text into motion video through script analysis, character design, storyboarding and synthesis."
      - repo: xhongc/ai_story
        zh: "AI 视频、AI 动漫、AI 短剧 / 漫剧自动化生成工具。"
        en: "Automated generator for AI videos, anime clips and AI dramas."
      - repo: LingyiChen-AI/AIComicBuilder
        zh: "把剧本变成动态漫画视频，含 AI 角色设计、分镜和视频合成。"
        en: "Turns scripts into animated comic videos with AI character design, storyboarding and video synthesis."
      - repo: Stonewuu/ai-fusion-video
        zh: "融光，基于 Agent 的全流程 AI 短剧 / 漫剧 / 视频创作平台（Java + AgentScope）。"
        en: "Agent-based end-to-end platform for short dramas, motion comics and videos, built with Java and AgentScope."
      - repo: LingGuoAI/LingGuo-Drama
        zh: "灵果短剧 AI，一句话生成完整短剧或漫剧。"
        en: "Lingguo Drama, a one-stop generator for mini-dramas and motion comics."
      - repo: shijue-aid/aid-studio
        zh: "AI 漫剧、短剧、电影与漫画创作平台，支持剧本、角色场景、智能分镜、出图出视频、配音和成片预览，可自部署。"
        en: "Self-hostable studio for AI dramas, films and comics with script, assets, storyboards, generation, dubbing and preview."
      - repo: 0xsline/StoryGen-Atelier
        zh: "分镜与视频生成工具，用 Gemini 写分镜和出关键帧、Veo 生成过渡镜头、ffmpeg 拼接成片。"
        en: "Storyboard and video tool using Gemini for boards and frames, Veo for transition clips and ffmpeg for the final cut."
      - repo: TypeTale/TypeTale
        zh: "字字动画，免费的 AIGC 视频生成软件，主打 AI 短剧、AI 电影和小说推文。"
        en: "TypeTale, a free AIGC video app for AI dramas, films and novel-promo videos."
      - repo: ChrisChen667788/wind-comic
        zh: "多 Agent 流水线，一行文字生成短剧：剧本、电影感分镜、角色一致的视频，模型供应商可替换。"
        en: "Multi-agent pipeline from one line of text to a short drama with script, cinematic boards and character-consistent video; provider-agnostic."
      - repo: Swayingleaves/novanova-studio
        zh: "Agent 驱动的全流程平台，集出图出视频、无限画布、小说转短剧、3D 导演台于一体。"
        en: "Agent-driven platform with image and video generation, infinite canvas, novel-to-drama and a 3D director stage."
      - repo: aqm857886159/Nomi
        zh: "本地优先的 AI 视频工作台，可接任意模型或本地 ComfyUI，让 Claude Code / Codex 通过 MCP 来执导，输出可编辑的时间线初剪。"
        en: "Local-first AI video workbench; bring any model or local ComfyUI and let Claude Code or Codex direct it over MCP into an editable first cut."
      - repo: UllrAI/CineGen-ShortDrama
        zh: "AI 导演系统，生成漫剧、动漫、短剧、解说漫和动态漫。"
        en: "AI director system for manga dramas, anime, short dramas and motion comics."
      - repo: Anil-matcha/Open-AI-Micro-Drama-Generator
        zh: "多 Agent 微短剧生成器，编剧 → 分镜 → 关键帧 → 视频。"
        en: "Multi-agent micro-drama generator, screenwriter to storyboard to frames to video."
      - repo: xeronsh/KomaSlate
        zh: "本地优先、非破坏性的 AI 分镜工作台，支持重拍镜头、版本对比和 FCPXML 导出。"
        en: "Local-first, non-destructive AI storyboarding workspace with shot retakes, version diffs and FCPXML export."
      - repo: Anning01/novelvids
        zh: "AI 漫剧与短剧创作工作台，覆盖故事创作、角色资产、分镜和出图出视频，支持本地部署。"
        en: "Self-hostable AI drama workspace covering story, character assets, storyboards and generation."
      - repo: Tenney95/AI-Canvas-tauri
        zh: "免费轻量的 AI 无限画布，支持短剧剧本、角色、分镜、出图出视频和剪辑，集成 ComfyUI、Agent、MCP。"
        en: "Free, lightweight AI canvas for drama scripts, characters, storyboards, generation and editing, with ComfyUI, agents and MCP."
      - repo: chillzhuang/Kinema
        zh: "由 Codex、Claude Code 驱动的影像智能体，管理章节与分镜规划、角色场景道具资产，直到成片。"
        en: "Video agent driven by Codex or Claude Code that plans chapters and shots and manages assets through to the final film."

  - id: skills
    zh: "Agent Skills（剧本 · 分镜 · 提示词）"
    en: "Agent skills (script, storyboard, prompts)"
    zh_intro: "装进 Claude Code、Codex、DeepSeek Harness 等智能体就能用的技能包，适合已有出图出视频渠道、想让 AI 写剧本和分镜的人。"
    en_intro: "Skill packs for Claude Code, Codex, DeepSeek Harness and similar agents, for people who already have generation tools and want the agent to write scripts and shot lists."
    items:
      - repo: Emily2040/seedance-2.0
        zh: "围绕 Seedance 2.0 的完整制作流程（剧本、分镜、提示词到成片）。"
        en: "Full production pipeline for filmmaking with Seedance 2.0."
      - repo: eternityspring/shuohao-skills
        zh: "AI 短剧制作 Skill：拆角色、排大纲、出场景与道具设定、写剧本、切分镜。"
        en: "Short-drama skills for character bibles, adaptation outlines, art bibles, screenplays and storyboards."
      - repo: dexhunter/seedance2-skill
        zh: "为 Seedance 2.0 写出高质量视频提示词的 Skill。"
        en: "Skill for writing strong Seedance 2.0 video prompts."
      - repo: zenstory-ai/drama-skills
        zh: "小说改剧本、角色三视图、分镜脚本、生图生视频提示词和成片审片。"
        en: "Novel-to-script, character turnarounds, shot lists, generation prompts and final-cut review."
      - repo: songguoxs/seedance-prompt-skill
        zh: "生成 Seedance 2.0 视频提示词的 Skill。"
        en: "Skill that writes Seedance 2.0 video prompts."
      - repo: liangdabiao/Seedance2-Storyboard-Generator
        zh: "把小说或故事转成多集视频剧本和分镜，针对 Seedance 2.0 设计。"
        en: "Turns novels and stories into multi-episode scripts and storyboards designed for Seedance 2.0."
      - repo: lixiaoxiao9888-create/manju-laoli-skill
        zh: "漫剧全流程套装：1 个总控 + 12 个子技能，覆盖素材、剧本、资产、分镜和质检。"
        en: "Manga-drama suite with one director skill and 12 sub-skills for research, script, assets, shots and QA."
      - repo: 0xsline/short-drama
        zh: "短剧剧本创作 Skill，从选题立项、分集撰写到质量自检、合规审核和出海。"
        en: "Short-drama screenwriting skill from concept and episodes to self-review, compliance and overseas release."
      - repo: zhanghao123vip/ai-manju-skills
        zh: "21 个题材的 AI 漫剧全流程 Skill，一句点子生成企划、资产提示词、分集剧本、分镜和视频提示词。"
        en: "AI manga-drama skills across 21 genres, from one idea to plan, asset prompts, episodes, shots and video prompts."
      - repo: lixiaoxiao9888-create/short-drama-factory
        zh: "面向抖音 / 红果的工业化短剧编剧系统，网文或创意改成 30 至 100 集剧本。"
        en: "Industrial short-drama screenwriting system that turns an idea or web novel into a 30 to 100 episode script."
      - repo: VanGong1999/screen-creative-skills
        zh: "31 个影视策划与评估 Skill：IP 改编、题材提炼、人物小传、拉片分析、大纲生成。"
        en: "31 film and TV development skills for IP adaptation, premise, character bios, breakdowns and outlines."
      - repo: A-cat-with-carrots/OnlyShot
        zh: "一句话 → 剧本、分镜、分镜图、视频、剪辑五步出短剧，集成即梦 / Seedance。"
        en: "Five-step short-drama pipeline (script, shots, frames, video, edit) integrated with Jimeng and Seedance."
      - repo: zhaihao118/Micro-Drama-Skills
        zh: "用 Claude Skills 串起剧本、角色设计、分镜生成到视频提交的短剧自动化流程。"
        en: "Claude Skills that automate a micro-drama workflow from script and characters to storyboards and video jobs."
      - repo: neopen/story-shot-agent
        zh: "剧本分镜智能体，把任意格式剧本拆成镜头片段并生成跨片段一致的视频提示词。"
        en: "Agent that splits any script into shots and writes consistent text-to-video prompts across them."
      - repo: Wan-Video/Wan-skills
        zh: "万相官方 Agent Skills，让智能体直接调用 Wan 的生成能力。"
        en: "Official Wan agent skills for calling Wan generation from your agent."

  - id: video-models
    zh: "开源视频生成模型"
    en: "Open video generation models"
    zh_intro: "可以下载权重本地跑或接进 ComfyUI 的视频模型。显存不够时可以先用各自的云端 API 或 RunningHub 这类云端 ComfyUI。"
    en_intro: "Video models with downloadable weights for local runs or ComfyUI. Without enough VRAM, start with their hosted APIs or a cloud ComfyUI."
    items:
      - repo: hpcaitech/Open-Sora
        zh: "Open-Sora，面向所有人的高效开源视频生成。"
        en: "Open-Sora, efficient open video generation for everyone."
      - repo: Wan-Video/Wan2.2
        zh: "阿里万相 Wan2.2，开源大规模视频生成模型，文生视频、图生视频都支持。"
        en: "Wan2.2 from Alibaba, an open large-scale video model for text-to-video and image-to-video."
      - repo: Wan-Video/Wan2.1
        zh: "万相 Wan2.1，上一代开源视频模型，社区工作流和 LoRA 资源丰富。"
        en: "Wan2.1, the previous Wan generation, with many community workflows and LoRAs."
      - repo: lllyasviel/FramePack
        zh: "让视频扩散在消费级显卡上也能跑长视频的框架。"
        en: "Makes long video diffusion practical on consumer GPUs."
      - repo: zai-org/CogVideo
        zh: "智谱 CogVideoX，文生视频和图生视频。"
        en: "CogVideoX from Zhipu, text-to-video and image-to-video."
      - repo: Tencent-Hunyuan/HunyuanVideo
        zh: "腾讯混元视频生成框架。"
        en: "Tencent Hunyuan video generation framework."
      - repo: Lightricks/LTX-Video
        zh: "LTX-Video，速度快的开源视频模型。"
        en: "LTX-Video, a fast open video model."
      - repo: Lightricks/LTX-2
        zh: "LTX-2 音视频联合生成模型，附 LoRA 训练工具。"
        en: "LTX-2 audio-video model with an official LoRA trainer."
      - repo: SkyworkAI/SkyReels-V2
        zh: "昆仑天工 SkyReels-V2，支持无限时长的影视级视频生成。"
        en: "SkyReels-V2, an infinite-length film generation model."
      - repo: Tencent-Hunyuan/HunyuanVideo-1.5
        zh: "混元视频 1.5，轻量版视频生成模型。"
        en: "HunyuanVideo-1.5, a lightweight video model."
      - repo: SandAI-org/MAGI-1
        zh: "自回归大规模视频生成，可逐段续写。"
        en: "Autoregressive large-scale video generation that extends clip by clip."
      - repo: PKU-YuanGroup/Helios
        zh: "实时长视频生成模型。"
        en: "Real-time long video generation model."
      - repo: Tencent-Hunyuan/HunyuanVideo-I2V
        zh: "基于混元视频的可定制图生视频模型。"
        en: "Customizable image-to-video model based on HunyuanVideo."
      - repo: SkyworkAI/SkyReels-V3
        zh: "SkyReels V3 多模态视频生成模型。"
        en: "SkyReels V3 multimodal video generation model."

  - id: consistency
    zh: "角色一致性与图像生成 / 编辑"
    en: "Character consistency and image generation"
    zh_intro: "漫剧最头疼的是\"同一个角色每张图都长得不一样\"。先用这些模型做稳定的角色设定图和关键帧，再拿去图生视频。"
    en_intro: "Keeping a character on-model across shots is the hardest part of AI drama. Use these to make stable character sheets and keyframes before image-to-video."
    items:
      - repo: black-forest-labs/flux
        zh: "FLUX.1 系列模型的官方推理代码。"
        en: "Official inference code for the FLUX.1 models."
      - repo: instantX-research/InstantID
        zh: "一张照片零样本保持人物身份。"
        en: "Zero-shot identity-preserving generation from a single photo."
      - repo: QwenLM/Qwen-Image
        zh: "通义千问图像模型，擅长复杂文字渲染和精确图像编辑，中文海报、字幕画面友好。"
        en: "Qwen-Image, strong at complex text rendering and precise editing, good for Chinese text in frame."
      - repo: tencent-ailab/IP-Adapter
        zh: "用参考图做提示的适配器，常用于锁定角色或画风。"
        en: "Image-prompt adapter widely used to lock a character or style."
      - repo: VectorSpaceLab/OmniGen2
        zh: "统一的多模态生成与编辑模型。"
        en: "Unified multimodal generation and editing model."
      - repo: ToTheBeginning/PuLID
        zh: "快速的人物 ID 定制。"
        en: "Fast identity customization."
      - repo: bytedance/UNO
        zh: "字节 UNO，单主体和多主体定制，适合多角色同框。"
        en: "ByteDance UNO for single- and multi-subject customization, useful for several characters in one frame."
      - repo: bytedance/USO
        zh: "字节 USO，统一风格与主体驱动生成，可同时锁角色和画风。"
        en: "ByteDance USO, unified style- and subject-driven generation."

  - id: voice
    zh: "配音 / TTS / 声音克隆"
    en: "Voice, TTS and voice cloning"
    zh_intro: "给角色配音、做旁白。多角色对白可以重点看 MOSS-TTSD、VibeVoice 这类对话合成模型。"
    en_intro: "Character voices and narration. For multi-speaker dialogue, look at dialogue models such as MOSS-TTSD and VibeVoice."
    items:
      - repo: RVC-Boss/GPT-SoVITS
        zh: "1 分钟语音就能训练出可用的声音模型，中文社区使用广泛。"
        en: "Few-shot voice cloning from about one minute of audio, widely used in Chinese communities."
      - repo: microsoft/VibeVoice
        zh: "微软开源语音模型，支持长篇多说话人语音合成。"
        en: "Microsoft's open voice models for long-form, multi-speaker speech."
      - repo: fishaudio/fish-speech
        zh: "Fish Speech 开源 TTS，中英日等多语言。"
        en: "Fish Speech open TTS with multilingual support."
      - repo: index-tts/index-tts
        zh: "B 站开源的 IndexTTS，工业级可控的零样本 TTS。"
        en: "IndexTTS from Bilibili, industrial-grade controllable zero-shot TTS."
      - repo: QwenAudio/CosyVoice
        zh: "通义 CosyVoice 多语言语音生成，推理、训练、部署全套。"
        en: "CosyVoice multilingual voice generation with inference, training and deployment."
      - repo: SWivid/F5-TTS
        zh: "基于 Flow Matching 的零样本 TTS。"
        en: "Zero-shot TTS based on flow matching."
      - repo: QwenLM/Qwen3-TTS
        zh: "通义 Qwen3-TTS，支持流式合成、自由描述音色设计和声音克隆。"
        en: "Qwen3-TTS with streaming synthesis, free-form voice design and voice cloning."
      - repo: SparkAudio/Spark-TTS
        zh: "Spark-TTS 中英双语 TTS 与声音克隆。"
        en: "Spark-TTS bilingual TTS and voice cloning."
      - repo: boson-ai/higgs-audio
        zh: "Boson AI 的文本-音频基础模型，表现力强。"
        en: "Expressive text-audio foundation model from Boson AI."
      - repo: bytedance/MegaTTS3
        zh: "字节 MegaTTS 3，中英零样本语音合成。"
        en: "ByteDance MegaTTS 3, zero-shot Chinese and English speech synthesis."
      - repo: OpenMOSS/MOSS-TTSD
        zh: "多说话人长对话合成，零样本克隆，适合角色对白。"
        en: "Long-form multi-speaker dialogue synthesis with zero-shot cloning, good for character dialogue."

  - id: lipsync
    zh: "口型同步与对话视频"
